name: Different Runners

on:
  workflow_dispatch:

jobs:
  ubuntu-runner:
    name: Ubuntu 24.04 runner
    runs-on: ubuntu-24.04
    steps:
      - name: Show OS release
        run: cat /etc/os-release

  windows-runner:
    name: Windows 2022 runner
    runs-on: windows-2022
    steps:
      - name: Show runner info
        shell: pwsh
        run: |
          echo "Hello from ${{ runner.os }}-${{ runner.arch }}"
          echo "Runner name (type): ${{ runner.name }}"

  macos-runner:
    name: macOS 14 runner
    runs-on: macos-14
    steps:
      - name: Show runner info
        run: |
          echo "Hello from ${{ runner.os }}-${{ runner.arch }}"
          echo "Runner name (type): ${{ runner.name }}"

  alpine-container:
    name: Alpine container on Ubuntu runner
    runs-on: ubuntu-24.04
    container:
      image: alpine:3.20
    steps:
      - name: Show runner info
        run: |
          echo "Hello from ${{ runner.os }}-${{ runner.arch }}"
          echo "Runner name (type): ${{ runner.name }}"
          echo "Container image:   $(grep PRETTY_NAME /etc/os-release)"
