name: Environments in Variables

on:
  workflow_dispatch:

jobs:

  accessing-from-env-dev:
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      - run: echo ${{vars.TEST_VAR}}

  accessing-from-env-prod:
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - run: echo ${{vars.TEST_VAR}}
