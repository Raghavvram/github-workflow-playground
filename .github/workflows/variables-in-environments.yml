name: Variables in Environments

on:
  workflow_dispatch:

jobs:
  show-dev-environment-variable:
    name: Show dev environment variable
    runs-on: ubuntu-24.04
    environment: dev
    steps:
      # TEST_VAR is defined in the repository/environment settings on GitHub.
      - run: echo ${{ vars.TEST_VAR }}

  show-prod-environment-variable:
    name: Show prod environment variable
    runs-on: ubuntu-24.04
    environment: prod
    steps:
      - run: echo ${{ vars.TEST_VAR }}

  show-global-variable:
    name: Show global variable
    runs-on: ubuntu-24.04
    steps:
      - run: echo ${{ vars.TEST_VAR }}
