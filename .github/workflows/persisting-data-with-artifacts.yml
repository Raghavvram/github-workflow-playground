name: Persisting Data with Artifacts

on:
  workflow_dispatch:

jobs:
  artifact-producer:
    name: Produce artifact
    runs-on: ubuntu-24.04
    steps:
      - name: Create data file
        run: |
          echo "This will be stored as an artifact!" > persisted-data.txt
          echo "Generated by artifact-producer job on $(date)" >> persisted-data.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: persisted-data
          path: persisted-data.txt

  artifact-consumer:
    name: Consume artifact
    runs-on: ubuntu-24.04
    needs: artifact-producer
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v8
        with:
          name: persisted-data
      - name: Read data file
        run: cat persisted-data.txt
